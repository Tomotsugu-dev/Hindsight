<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Hindsight</title>
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Tomotsugu-dev/Hindsight@main/src/assets/logo.png">
  <!-- 找不到文件时返回本页，状态码 404（web/wrangler.jsonc 的 not_found_handling: "404-page"）。
       任何路径下都可能返回本页，所以链接都写成从根开始的路径。 -->
  <link rel="stylesheet" href="/site.css">
  <style>
    /* 页脚贴在窗口底部，中间的提示上下居中 */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ============ 提示 ============ */

    .lost {
      flex: 1;
      display: flex;
      align-items: center;
      padding-block: clamp(64px, 12vh, 128px);
      text-align: center;
    }

    .lost-code {
      font-size: clamp(40px, 5.2vw, 68px);
      font-weight: 800;
      line-height: 1.15;
      color: var(--accent);
    }

    .lost h1 {
      margin-top: 12px;
      font-size: clamp(30px, 3.2vw, 44px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .lost-sub {
      margin-top: 10px;
      font-size: clamp(17px, 1.5vw, 20px);
      color: var(--muted);
    }

    /* 和首页的下载按钮一样 */
    .lost-home {
      display: inline-flex;
      margin-top: 32px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s;
    }

    .lost-home:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>

  <!-- ============ Nav ============ -->
  <header class="topline">
    <div class="page topline-inner">
      <a href="/" class="brand">
        <img src="https://cdn.jsdelivr.net/gh/Tomotsugu-dev/Hindsight@main/src/assets/logo.png" alt="" width="28" height="28">
        <span>Hindsight</span>
      </a>
      <nav class="topline-links" aria-label="页面">
        <a href="/#features">功能</a>
        <a href="/#demo">演示</a>
        <a href="/#download">下载</a>
      </nav>
      <details class="lang">
        <summary aria-label="语言">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            <line x1="2" y1="12" x2="22" y2="12"></line>
          </svg>
          简体中文
        </summary>
        <ul>
          <li><a href="/?hl=zh">简体中文</a></li>
          <li><a href="/tw/">繁體中文</a></li>
          <li><a href="/en/">English</a></li>
          <li><a href="/ja/">日本語</a></li>
          <li><a href="/pt/">Português</a></li>
        </ul>
      </details>
      <a href="https://github.com/Tomotsugu-dev/Hindsight" class="topline-github" aria-label="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.92.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.67.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- ============ 404 ============ -->
  <main class="lost">
    <div class="page">
      <p class="lost-code">404</p>
      <h1>页面不存在</h1>
      <p class="lost-sub" lang="en">Page not found</p>
      <a href="/" class="lost-home">返回首页 · Home</a>
    </div>
  </main>

  <!-- ============ Footer ============ -->
  <footer class="foot">
    <div class="page foot-grid">
      <div class="foot-brand">
        <p class="foot-name">Hindsight</p>
        <p>© 2026 Hindsight contributors · GPL 3.0</p>
      </div>
      <ul>
        <li><a href="https://github.com/Tomotsugu-dev/Hindsight/releases">所有版本</a></li>
        <li><a href="https://github.com/Tomotsugu-dev/Hindsight/tree/main/docs/release-notes">更新日志</a></li>
        <li><a href="/docs/zh/">功能说明</a></li>
      </ul>
      <ul>
        <li><a href="https://github.com/Tomotsugu-dev/Hindsight">GitHub 仓库</a></li>
        <li><a href="https://github.com/Tomotsugu-dev/Hindsight/issues">报告问题</a></li>
        <li><a href="/themes/">主题市场</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
