# 推 v* tag → 自动出 macOS（通用：Intel + Apple Silicon）+ Windows 双平台 release。
#
# 触发：
#   git tag v0.4.5-beta && git push origin v0.4.5-beta
#   或在 GitHub Actions 页手动 run（workflow_dispatch）
#
# 产物：同一个 release tag 下：
#   - hindsight_X.Y.Z_universal.dmg            （macOS 通用）
#   - hindsight_X.Y.Z_universal.app.tar.gz     （macOS updater 包）
#   - hindsight_X.Y.Z_universal.app.tar.gz.sig
#   - hindsight_X.Y.Z_x64-setup.exe            （Windows）
#   - hindsight_X.Y.Z_x64-setup.exe.sig
#   - latest.json                              （updater manifest，自动合并 platforms）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.4.5-beta). Must match package.json/Cargo.toml/tauri.conf.json version."
        required: true

permissions:
  # tauri-action 创建 GitHub Release + 上传产物需要写权限
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      # Mac 失败时仍尽量出 Win 版本——不同平台彼此独立
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (macOS universal needs both arches)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      # macOS：把 Developer ID Application .p12 导入临时 keychain。
      # 用临时 keychain 而非 default 是为了 CI 隔离——run 结束随机 cleanup。
      - name: Import Apple Developer ID cert
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"

          # 让 codesign 不弹密码框访问私钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 加进搜索路径，并设为 default（tauri/codesign 默认查 default keychain）
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # sanity check
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install npm deps
        run: npm ci

      # 读 docs/release-notes/<tag>.md 当 release body + 应用内"检查更新"对话框文案
      - name: Read release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo 'body<<RELEASE_NOTES_EOF'
              cat "$NOTES_FILE"
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$NOTES_FILE 不存在，release body 用占位字符串"
            echo "body=Hindsight ${TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & upload via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 的 minisign 私钥——签 .app.tar.gz / setup.exe 让 updater 验证
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization（仅 macOS job 用得到，Win job 看到也无害）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: "Hindsight ${{ steps.notes.outputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # tag 含 -beta / -rc / -alpha 自动标 prerelease；正式版走稳定通道
          prerelease: ${{ contains(steps.notes.outputs.tag, '-beta') || contains(steps.notes.outputs.tag, '-rc') || contains(steps.notes.outputs.tag, '-alpha') }}
          args: ${{ matrix.args }}
          # createUpdaterArtifacts: true 已在 tauri.conf.json 里设置，
          # tauri-action 会自动合成跨平台 latest.json 上传到 release
          includeUpdaterJson: true

  # release 页只留英文，应用内保持全语言。
  #
  # 为什么是独立 job 而不是改上面的 releaseBody：latest.json 的 notes 字段由
  # tauri-action 从 release body 派生（实测 v0.8.21 两者逐字节相同），直接把
  # releaseBody 换成英文会连应用内弹窗的多语言一起砍掉。所以顺序必须是
  # 「先用全语言建 release → latest.json 落定 → 再改页面正文」，
  # needs: release 保证两条矩阵腿的 tauri-action 都跑完了才动。
  #
  # 动机：<!-- xx --> 标记在 GitHub 上不可见，发布页会把各语言块首尾相接排下来
  # ——v0.8.21 是 5 段共 10 条 bullet，「【0.8.21】」重复 5 次且无任何分隔，
  # 语言越多越长。发布页读者以英文为主；需要母语说明的用户在应用内看得到。
  trim-release-body:
    name: Trim release body to English
    needs: release
    # 一条矩阵腿失败时 release 页仍已建出，长度问题照样存在 —— 只要没被取消就跑
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace body with the English block
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/release-notes/${TAG}.md"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::release $TAG 不存在（构建可能全失败），跳过裁剪"
            exit 0
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::warning::$NOTES_FILE 不存在，保留原 body"
            exit 0
          fi

          # 抽 <!-- en --> 到下一个语言标记之间的内容。标记形如 <!-- xx -->，
          # 用 [a-z][a-z] 而不是 {2}，避免依赖 awk 的 interval 支持。
          awk '
            /^<!-- [a-z][a-z] -->$/ { want = ($0 == "<!-- en -->"); next }
            want { print }
          ' "$NOTES_FILE" | sed -e '/./,$!d' > /tmp/body_en.md
          # 去掉尾部空行
          printf '%s\n' "$(cat /tmp/body_en.md)" > /tmp/body_en.md

          if [ ! -s /tmp/body_en.md ]; then
            echo "::warning::$NOTES_FILE 里没有 <!-- en --> 块，保留原 body"
            exit 0
          fi

          # 页脚：从文件里实际存在的标记推语言清单，加语言时不用回来改这里。
          # 用 awk 拼接而不是 paste -sd —— paste 的分隔符只吃单字符，
          # " · " 这种多字符串会被截成一个字符（本地实测）。
          LANGS=$(grep -oE '^<!-- [a-z][a-z] -->$' "$NOTES_FILE" \
            | grep -v '<!-- en -->' \
            | sed -e 's/<!-- //' -e 's/ -->//' \
            | sed -e 's/^zh$/简体中文/' -e 's/^tw$/繁體中文/' -e 's/^ja$/日本語/' \
                  -e 's/^pt$/Português/' -e 's/^es$/Español/' \
            | awk 'NR>1{printf " · "} {printf "%s", $0} END{print ""}')
          if [ -n "$LANGS" ]; then
            {
              echo
              echo "---"
              echo
              echo "These notes are also available in $LANGS — the in-app updater shows them in your interface language."
            } >> /tmp/body_en.md
          fi

          gh release edit "$TAG" --notes-file /tmp/body_en.md
          echo "release body 已裁剪为英文块（$(wc -l < /tmp/body_en.md) 行）"
