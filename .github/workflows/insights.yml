name: Internal GitHub Insights

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: Asia/Tokyo
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/insights/**
      - .github/workflows/insights.yml

permissions:
  contents: read

# The collector merges history before writing it. Serialize manual and scheduled
# runs so two collectors cannot overwrite one another's archive.
concurrency:
  group: internal-github-insights
  cancel-in-progress: false

jobs:
  verify:
    name: Verify collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/insights/*.test.mjs
  collect:
    name: Archive repository Insights
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and save privately to Cloudflare KV
        env:
          GH_INSIGHTS_TOKEN: ${{ secrets.GH_INSIGHTS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/insights/collect.mjs
