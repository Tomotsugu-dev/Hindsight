# Builds the website (landing pages, web demo, docs) with `npm run build:web`
# and publishes dist-web/ as the Cloudflare Worker `hindsight`, which serves
# static assets only (configured in web/wrangler.jsonc).
#
# - A push to main deploys production, served at hindsight.kyosweb.com.
# - A pull request from a branch of this repo uploads a preview version at
#   <branch>-hindsight.<account subdomain>.workers.dev without touching
#   production. Without the API token (pull requests from forks never get
#   secrets) the preview is skipped and the job only builds, which still
#   runs the link check. Production fails instead, so a missing secret shows.
# - The demo renders the app's own components from src/, so changes there
#   redeploy the site too.
#
# Repository secrets:
# - CLOUDFLARE_API_TOKEN: an API token made from the "Edit Cloudflare Workers"
#   template.
# - CLOUDFLARE_ACCOUNT_ID

name: Web

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - src/**
      - docs/intro/**
      - docs/features/**
      - scripts/web/**
      - scripts/docs/**
      - package.json
      - package-lock.json
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - src/**
      - docs/intro/**
      - docs/features/**
      - scripts/web/**
      - scripts/docs/**
      - package.json
      - package-lock.json
      - .github/workflows/web.yml
  workflow_dispatch:

# A newer push to the same branch replaces the deploy still going.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build the site
        run: npm run build:web

      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4.152.0 deploy --config web/wrangler.jsonc

      - name: Upload a preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # The alias becomes part of a hostname: lowercase letters, digits and dashes only.
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          npx --yes wrangler@4.152.0 versions upload --config web/wrangler.jsonc --preview-alias "$alias"
